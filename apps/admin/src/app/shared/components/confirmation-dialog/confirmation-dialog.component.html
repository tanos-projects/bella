<h1 mat-dialog-title>Confirmation</h1>
<div mat-dialog-content>
  <p>{{ data?.message ?? "Êtes-vous sûr de vouloir poursuivre ?" }}</p>
</div>
<div mat-dialog-actions>
  <button mat-button [mat-dialog-close]="false">Non</button>
  <button mat-raised-button [mat-dialog-close]="true" cdkFocusInitial color="warn">Oui</button>
</div>
