<table mat-table [dataSource]="publications">
  <ng-container matColumnDef="createdAt">
    <th mat-header-cell *matHeaderCellDef mat-sort-header>Créée le</th>
    <td mat-cell *matCellDef="let row">{{ row.createdAt | date}}</td>
  </ng-container>
  <ng-container matColumnDef="title">
    <th mat-header-cell *matHeaderCellDef>Titre</th>
    <td mat-cell *matCellDef="let row">{{ row.title }}</td>
  </ng-container>

  <ng-container matColumnDef="price">
    <th mat-header-cell *matHeaderCellDef>Prix</th>
    <td mat-cell *matCellDef="let row">
      {{ row.price | currency: row.currency ?? 'XOF' }}
    </td>
  </ng-container>

  <ng-container matColumnDef="city">
    <th mat-header-cell *matHeaderCellDef>Ville</th>
    <td mat-cell *matCellDef="let row">{{ row.city }}</td>
  </ng-container>

  <ng-container matColumnDef="action">
    <th mat-header-cell *matHeaderCellDef>Actions</th>
    <td mat-cell *matCellDef="let element">
      <button (click)="onApprove(element)" mat-button color="primary">
        <mat-icon
          aria-hidden="false"
          aria-label="Approver"
          fontIcon="check"
        ></mat-icon> Approuver
      </button>
      <button (click)="onReject(element)" mat-button color="accent">
        <mat-icon
          aria-hidden="false"
          aria-label="Rejeter"
          fontIcon="dangerous"
        ></mat-icon> Rejeter
      </button>
      <button (click)="onDelete(element)" mat-button color="warn">
        <mat-icon
          aria-hidden="false"
          aria-label="Suppression définitive"
          fontIcon="delete"
        ></mat-icon> Supprimer
      </button>
    </td>
  </ng-container>

  <tr mat-header-row *matHeaderRowDef="displayedColumns"></tr>
  <tr mat-row *matRowDef="let row; columns: displayedColumns"></tr>
</table>
