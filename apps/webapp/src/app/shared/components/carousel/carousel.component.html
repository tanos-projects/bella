@if (images.length > 0) {
  <swiper-container
    [centeredSlides]="true"
    [pagination]="{
    type: 'bullets',
    clickable: true
  }"
    [navigation]="true"
    [loop]="true"
    class="image"
  >
    @for (image of images; track image.url; let indexOfelement = $index) {
      <swiper-slide>
        <img [src]="image.url" height="100%" alt="Image {{indexOfelement}}" />
      </swiper-slide>
    }
  </swiper-container>
}
@if (images.length === 0) {
  <div class="image">
    <img class="image" height="100%" src="../../../../assets/images/no-picture.svg" alt="Aucune image disponible" />
  </div>
}
