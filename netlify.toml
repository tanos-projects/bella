# Shared Netlify settings for every site built from this repository.
#
# Three sites are linked to it — dev-bella (webapp), dev-admin-bella (admin)
# and api-bella — and a root-level [build] block applies to ALL of them, since
# netlify.toml has no per-site scoping. Setting `command` and `publish` here
# therefore made all three deploy the webapp, so those two keys deliberately
# stay out of this file and belong in each site's own configuration:
#
#   dev-bella        npx nx build webapp   ->  dist/apps/webapp
#   dev-admin-bella  npx nx build admin    ->  dist/apps/admin
#   api-bella        (the API is a NestJS server, not a static site)
#
# Only settings that are correct for every site live here.
#
# The SPA rewrite is not needed here either: apps/webapp/src/_redirects carries
# `/* /index.html 200` and the build copies it into the output.

[build.environment]
  NODE_VERSION = "22"
