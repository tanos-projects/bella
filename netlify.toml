# Versioned build configuration for the dev-bella site, which serves the
# public webapp. Without this the settings live only in the dashboard, where
# they still describe the predecessor repository's layout (a top-level
# front-end/ directory that does not exist here), so every deploy failed
# within seconds of starting.
#
# Netlify gives this file precedence over the dashboard.
#
# The SPA rewrite is not repeated here: apps/webapp/src/_redirects already
# carries `/* /index.html 200` and is copied into the build output by the
# webapp's `assets` configuration.

[build]
  command = "npx nx build webapp"
  publish = "dist/apps/webapp"

[build.environment]
  NODE_VERSION = "22"
